<div class="mt-4">
  <h2>Shorten a URL</h2>

  <form [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate>

    <div class="mb-3">
      <label for="original-url"
             class="form-label">

        Original URL
      </label>

      <input id="original-url"
             type="url"
             class="form-control"
             placeholder="https://example.com"
             formControlName="url">

      @if (
      urlControl.touched &&
      urlControl.hasError('required')
      ) {
      <div class="text-danger mt-1">
        URL is required.
      </div>
      }
    </div>

    <button type="submit"
            class="btn btn-primary"
            [disabled]="form.invalid || isSubmitting()">

      @if (isSubmitting()) {
      Shortening...
      } @else {
      Shorten URL
      }
    </button>
  </form>

  @if (shortenedUrl(); as url) {
  <div class="alert alert-success mt-3">
    <p class="mb-2">
      The URL was shortened successfully:
    </p>

    <a [href]="url"
       target="_blank"
       rel="noopener noreferrer">

      {{ url }}
    </a>

    <div class="mt-2">
      <small>
        Identifier: {{ shortUrlId() }}
      </small>
    </div>
  </div>
  }

  @if (errorMessage()) {
  <div class="alert alert-danger mt-3">
    {{ errorMessage() }}
  </div>
  }
</div>
